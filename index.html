<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>計算機</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .page {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      max-width: 720px;
    }

    /* カード共通スタイル。計算機・練習課題・履歴をそれぞれ1枚のカードにまとめる */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 16px;
    }

    h2 {
      font-size: 16px;
      margin: 0 0 16px;
      color: #444;
    }

    input[type="number"] {
      width: 80px;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
    }

    button {
      padding: 8px 14px;
      margin: 0 4px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #4a6cf7;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #3955d1;
    }

    #result,
    #sumResult {
      /* 式と結果を表示する場所のスタイル */
      margin-top: 16px;
      font-size: 24px;
      font-weight: bold;
      color: #222;
      word-break: break-all;
    }

    .history-card {
      width: 240px;
      max-height: 260px;
      overflow-y: auto;
    }

    #history {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
      font-size: 14px;
    }

    #history li {
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>

  <div class="page">

    <div class="card">
      <h1>計算機</h1>

      <!-- 数値を入力する欄。type="number" で数字専用の入力欄になる -->
      <input type="number" id="num1" value="0">
      <input type="number" id="num2" value="0">

      <!-- 演算子ボタン。onclick で押したときに呼ぶ関数と引数を指定 -->
      <div>
        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">-</button>
        <button onclick="calculate('×')">×</button>
        <button onclick="calculate('÷')">÷</button>
      </div>

      <!-- 計算結果を表示する場所。id をつけてJSから操作できるようにする -->
      <p id="result">ここに結果が表示されます</p>
    </div>

    <div class="card">
      <h2>1からnまでの合計（練習課題）</h2>
      <input type="number" id="sumN" value="10">
      <button onclick="calculateSumTo()">計算</button>
      <p id="sumResult">ここに結果が表示されます</p>
    </div>

    <div class="card history-card">
      <h2>計算履歴</h2>
      <ul id="history"></ul>
    </div>

  </div>

  <script>
    // ── 状態を覚えておく変数 ────────────────────────────────────────
    // lastOperator: 直前に押された演算子。Enterキーでの再計算に使う
    let lastOperator = null;

    // ── 関数 ──────────────────────────────────────────────────────
    // calculate = 計算を行う関数。押されたボタンの演算子が引数として渡される
    function calculate(operator) {
      lastOperator = operator;

      const num1El = document.getElementById('num1');
      const num2El = document.getElementById('num2');

      // ── 変数 ──────────────────────────────────────────────────
      // Number() → 文字列を数値に変換する
      // document.getElementById('num1').value → id="num1" の入力欄の値を取得
      let a = Number(num1El.value);
      let b = Number(num2El.value);
      let result;  // 計算結果を入れる箱（まだ中身は空）

      // ── 条件分岐 ──────────────────────────────────────────────
      // どの演算子ボタンが押されたかで処理を変える
      if (operator === '+') {
        result = a + b;
      } else if (operator === '-') {
        result = a - b;
      } else if (operator === '×') {
        result = a * b;
      } else if (operator === '÷') {
        if (b === 0) {
          result = 'エラー: 0では割れません';
        } else {
          result = a / b;
        }
      }

      // 計算結果を「式 = 結果」の形にして画面に表示する（DOM操作）
      const formula = `${a} ${operator} ${b} = ${result}`;
      document.getElementById('result').textContent = formula;
      addHistory(formula);

      // ── 連続計算 ──────────────────────────────────────────────
      // エラーでなければ、結果を次の計算の1つ目の数として使えるようにする
      if (typeof result === 'number') {
        num1El.value = result;
        num2El.value = 0;
        num2El.focus();
      }
    }

    // sumTo = 1からnまでの整数を合計する関数（練習課題）
    function sumTo(n) {
      let total = 0;
      // for文で1からnまで1つずつ足していく
      for (let i = 1; i <= n; i++) {
        total += i;
      }
      return total;
    }

    // calculateSumTo = sumTo()の結果を画面に表示する関数
    function calculateSumTo() {
      const n = Number(document.getElementById('sumN').value);
      const total = sumTo(n);
      const formula = `1から${n}までの合計 = ${total}`;
      document.getElementById('sumResult').textContent = formula;
      addHistory(formula);
    }

    // addHistory = 計算履歴の一覧に新しい行を追加する関数
    function addHistory(text) {
      const historyList = document.getElementById('history');
      const li = document.createElement('li');
      li.textContent = text;
      // 新しい履歴ほど上に表示されるように先頭に追加する
      historyList.insertBefore(li, historyList.firstChild);
    }

    // ── イベントリスナー ──────────────────────────────────────────
    // Enterキーが押されたとき、直前と同じ演算子で再計算する
    document.getElementById('num2').addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && lastOperator) {
        calculate(lastOperator);
      }
    });

    document.getElementById('sumN').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        calculateSumTo();
      }
    });
  </script>

</body>
</html>
